[project]
name = "odin"
version = "0.1.0"
description = "Experimental Northgard observation and control interface for reinforcement learning."
readme = "README.md"
authors = [
    { name = "Astrazo" }
]
requires-python = ">=3.13"
dependencies = ["typer"]

[project.scripts]
odin = "odin.main:app"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
